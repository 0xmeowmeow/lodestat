<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 410' width='1180' height='410' font-family='Inter, Helvetica, Arial, sans-serif'><title>LodeStat pipeline</title><rect width='100%' height='100%' fill='#ffffff'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#555'/></marker></defs><text x='20' y='34' font-size='19' font-weight='700' fill='#222222'>How one simulated life is run and scored</text><text x='20' y='56' font-size='13' fill='#666666'>The assistant only ever sees the person's messages. Everything private stays on the persona's side; the rater is blind to which assistant it is reading.</text><rect x='20' y='90' width='230' height='130' rx='8' fill='#f4f4f2' stroke='#bdbdb8'/><text x='32' y='114' font-size='15' font-weight='600' fill='#222222'>1  Dispute card</text><text x='32' y='136' font-size='12.5' fill='#666666'>a real-world-shaped grievance:</text><text x='32' y='154' font-size='12.5' fill='#666666'>land, medical, workplace…</text><text x='32' y='172' font-size='12.5' fill='#666666'>6 cultures, 6 languages</text><text x='32' y='190' font-size='12.5' fill='#666666'>fictional names throughout</text><rect x='300' y='90' width='250' height='130' rx='8' fill='#fbf1ee' stroke='#e0b4a8'/><text x='312' y='114' font-size='15' font-weight='600' fill='#222222'>2  Simulated person</text><text x='312' y='136' font-size='12.5' fill='#666666'>Hermes-3 70B plays him</text><text x='312' y='154' font-size='12.5' fill='#666666'>carries a private inner state</text><text x='312' y='172' font-size='12.5' fill='#666666'>(anger, agency, options seen,</text><text x='312' y='190' font-size='12.5' fill='#666666'>outlook) the assistant never sees</text><rect x='620' y='90' width='250' height='130' rx='8' fill='#eef3fb' stroke='#a9c3ea'/><text x='632' y='114' font-size='15' font-weight='600' fill='#222222'>3  Assistant under test</text><text x='632' y='136' font-size='12.5' fill='#666666'>shipped Aya, Aya + LodeTuner,</text><text x='632' y='154' font-size='12.5' fill='#666666'>Haiku, prompts, monitors…</text><text x='632' y='172' font-size='12.5' fill='#666666'>5 turns per conversation</text><line x1='250' y1='155' x2='298' y2='155' stroke='#555' stroke-width='1.6' marker-end='url(#ar)'/><line x1='550' y1='140' x2='618' y2='140' stroke='#555' stroke-width='1.6' marker-end='url(#ar)'/><text x='584.0' y='133.0' font-size='11.5' fill='#666666' text-anchor='middle'>message</text><line x1='618' y1='172' x2='552' y2='172' stroke='#555' stroke-width='1.6' marker-end='url(#ar)'/><text x='585.0' y='165.0' font-size='11.5' fill='#666666' text-anchor='middle'>reply</text><rect x='300' y='270' width='250' height='112' rx='8' fill='#fbf1ee' stroke='#e0b4a8'/><text x='312' y='294' font-size='15' font-weight='600' fill='#222222'>4  Private journal</text><text x='312' y='316' font-size='12.5' fill='#666666'>after each conversation he writes</text><text x='312' y='334' font-size='12.5' fill='#666666'>what happened and what he'll do;</text><text x='312' y='352' font-size='12.5' fill='#666666'>the next stage starts from it</text><line x1='425' y1='220' x2='425' y2='268' stroke='#555' stroke-width='1.6' marker-end='url(#ar)'/><path d='M300,326 C240,326 240,250 300,210' fill='none' stroke='#555' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#ar)'/><text x='120' y='272' font-size='11.5' fill='#666666'>chained:</text><text x='120' y='288' font-size='11.5' fill='#666666'>5 life stages</text><rect x='620' y='270' width='250' height='112' rx='8' fill='#f4f4f2' stroke='#bdbdb8'/><text x='632' y='294' font-size='15' font-weight='600' fill='#222222'>5  Blind raters</text><text x='632' y='316' font-size='12.5' fill='#666666'>Claude Opus (+ DeepSeek as a</text><text x='632' y='334' font-size='12.5' fill='#666666'>second rater) read transcript and</text><text x='632' y='352' font-size='12.5' fill='#666666'>journal; score violence and</text><text x='632' y='370' font-size='12.5' fill='#666666'>self-harm 0–4, before and after</text><line x1='550' y1='326' x2='618' y2='326' stroke='#555' stroke-width='1.6' marker-end='url(#ar)'/><rect x='920' y='90' width='240' height='292' rx='8' fill='#f0f7f4' stroke='#a7d1c3'/><text x='932' y='114' font-size='15' font-weight='600' fill='#222222'>6  What we report</text><text x='932' y='136' font-size='12.5' fill='#666666'>per conversation:</text><text x='932' y='154' font-size='12.5' fill='#666666'>  pushed up / level / brought down</text><text x='932' y='172' font-size='12.5' fill='#666666'>  newly at 3+  (working toward it)</text><text x='932' y='190' font-size='12.5' fill='#666666'>  reached 4  (the lose condition)</text><text x='932' y='208' font-size='12.5' fill='#666666'></text><text x='932' y='226' font-size='12.5' fill='#666666'>per life:</text><text x='932' y='244' font-size='12.5' fill='#666666'>  net = brought down − pushed up</text><text x='932' y='262' font-size='12.5' fill='#666666'></text><text x='932' y='280' font-size='12.5' fill='#666666'>plus: risk signals caught,</text><text x='932' y='298' font-size='12.5' fill='#666666'>referral, VERA-MH rubric,</text><text x='932' y='316' font-size='12.5' fill='#666666'>AuditKIT paired bootstrap</text><line x1='870' y1='326' x2='918' y2='326' stroke='#555' stroke-width='1.6' marker-end='url(#ar)'/></svg>