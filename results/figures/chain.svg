<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 362' width='1180' height='362' font-family='Inter, Helvetica, Arial, sans-serif'><title>Lexsi tool chain</title><rect width='100%' height='100%' fill='#ffffff'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#555'/></marker></defs><text x='20' y='34' font-size='19' font-weight='700' fill='#222222'>Built end to end on the Lexsi open-source stack</text><text x='20' y='56' font-size='13' fill='#666666'>Each library did one job. LodeStat is the piece we added between training and audit; SafeTune's steering dial runs as one of the arms it tests.</text><rect x='20' y='80' width='240' height='130' rx='8' fill='#f4f4f2' stroke='#bdbdb8'/><text x='32' y='104' font-size='15' font-weight='600' fill='#222222'>CuratorKIT</text><text x='32' y='126' font-size='12.5' fill='#666666'>gate the data</text><text x='32' y='144' font-size='12.5' fill='#666666'></text><text x='32' y='162' font-size='12.5' fill='#666666'>schema check on every</text><text x='32' y='180' font-size='12.5' fill='#666666'>training set</text><text x='32' y='198' font-size='12.5' fill='#666666'>(903 of 903 rows passed)</text><line x1='260' y1='145' x2='308' y2='145' stroke='#555' stroke-width='1.6' marker-end='url(#ar)'/><rect x='310' y='80' width='240' height='130' rx='8' fill='#f4f4f2' stroke='#bdbdb8'/><text x='322' y='104' font-size='15' font-weight='600' fill='#222222'>AlignTune</text><text x='322' y='126' font-size='12.5' fill='#666666'>train the adapter</text><text x='322' y='144' font-size='12.5' fill='#666666'></text><text x='322' y='162' font-size='12.5' fill='#666666'>LoRA SFT on Aya Expanse 8B</text><text x='322' y='180' font-size='12.5' fill='#666666'>→ LodeTuner; we found and</text><text x='322' y='198' font-size='12.5' fill='#666666'>reported a loader bug (#64)</text><line x1='550' y1='145' x2='598' y2='145' stroke='#555' stroke-width='1.6' marker-end='url(#ar)'/><rect x='600' y='80' width='240' height='130' rx='8' fill='#eef3fb' stroke='#a9c3ea'/><text x='612' y='104' font-size='15' font-weight='600' fill='#222222'>LodeStat</text><text x='612' y='126' font-size='12.5' fill='#666666'>run the lives</text><text x='612' y='144' font-size='12.5' fill='#666666'></text><text x='612' y='162' font-size='12.5' fill='#666666'>simulated people, blind</text><text x='612' y='180' font-size='12.5' fill='#666666'>raters, escalation pathway</text><text x='612' y='198' font-size='12.5' fill='#666666'>(what we added)</text><line x1='840' y1='145' x2='888' y2='145' stroke='#555' stroke-width='1.6' marker-end='url(#ar)'/><rect x='890' y='80' width='240' height='130' rx='8' fill='#f4f4f2' stroke='#bdbdb8'/><text x='902' y='104' font-size='15' font-weight='600' fill='#222222'>AuditKIT</text><text x='902' y='126' font-size='12.5' fill='#666666'>decide what holds</text><text x='902' y='144' font-size='12.5' fill='#666666'></text><text x='902' y='162' font-size='12.5' fill='#666666'>paired bootstrap for every</text><text x='902' y='180' font-size='12.5' fill='#666666'>arm; we reported a p-value</text><text x='902' y='198' font-size='12.5' fill='#666666'>bug, fixed upstream</text><rect x='600' y='250' width='240' height='92' rx='8' fill='#f4f4f2' stroke='#bdbdb8'/><text x='612' y='274' font-size='15' font-weight='600' fill='#222222'>SafeTune</text><text x='612' y='296' font-size='12.5' fill='#666666'>steering dial (CAA): one arm</text><text x='612' y='314' font-size='12.5' fill='#666666'>of the benchmark, compared</text><text x='612' y='332' font-size='12.5' fill='#666666'>with the adapter and prompts</text><line x1='720' y1='250' x2='720' y2='212' stroke='#555' stroke-width='1.6' marker-end='url(#ar)'/></svg>